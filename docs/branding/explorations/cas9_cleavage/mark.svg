<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAGESTIC Cas9 cleavage mark">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a33"/>
      <stop offset="1" stop-color="#06151a"/>
    </linearGradient>
    <linearGradient id="lobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#16a35a"/>
    </linearGradient>
    <linearGradient id="lobe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fce98"/>
      <stop offset="1" stop-color="#0f8f6e"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.45" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#tile)"/>

  <!-- ===== genomic DNA duplex, horizontal, cleaved in the middle ===== -->
  <!-- left fragment -->
  <rect x="22"  y="150" width="86" height="9" rx="4.5" fill="#dfeef2"/>
  <rect x="22"  y="167" width="86" height="9" rx="4.5" fill="#9fc2cc"/>
  <!-- base-pair rungs left -->
  <g stroke="#74a0ab" stroke-width="3" stroke-linecap="round">
    <line x1="34" y1="159" x2="34" y2="167"/>
    <line x1="50" y1="159" x2="50" y2="167"/>
    <line x1="66" y1="159" x2="66" y2="167"/>
    <line x1="82" y1="159" x2="82" y2="167"/>
    <line x1="98" y1="159" x2="98" y2="167"/>
  </g>
  <!-- right fragment -->
  <rect x="148" y="150" width="86" height="9" rx="4.5" fill="#dfeef2"/>
  <rect x="148" y="167" width="86" height="9" rx="4.5" fill="#9fc2cc"/>
  <g stroke="#74a0ab" stroke-width="3" stroke-linecap="round">
    <line x1="158" y1="159" x2="158" y2="167"/>
    <line x1="174" y1="159" x2="174" y2="167"/>
    <line x1="190" y1="159" x2="190" y2="167"/>
    <line x1="206" y1="159" x2="206" y2="167"/>
    <line x1="222" y1="159" x2="222" y2="167"/>
  </g>

  <!-- ===== cleavage flash at the break ===== -->
  <circle cx="128" cy="163" r="34" fill="url(#spark)"/>
  <!-- jagged cut line through the gap -->
  <path d="M128 136 L121 156 L133 163 L121 170 L128 190"
        stroke="#fff2c2" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== guide RNA threading in from upper-left into the active site ===== -->
  <path d="M40 58 Q90 74 116 132"
        stroke="#2bc8ff" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="3 13"/>

  <!-- ===== bilobed Cas9 protein gripping the cut ===== -->
  <!-- back lobe (recognition) -->
  <path d="M70 92
           C58 70 78 50 104 54
           C128 58 134 82 124 104
           C118 118 96 124 84 116
           C74 110 74 102 70 92 Z"
        fill="url(#lobe2)" stroke="#0a5c44" stroke-width="3"/>
  <!-- front lobe (nuclease) gripping over the DNA -->
  <path d="M118 92
           C112 66 140 50 168 58
           C196 66 200 100 184 124
           C172 142 146 148 128 138
           C112 130 116 110 118 92 Z"
        fill="url(#lobe)" stroke="#0a6b4a" stroke-width="3"/>
  <!-- cleft / active-site notch between lobes pointing at the cut -->
  <path d="M120 122 L128 150 L140 124"
        fill="#06151a" opacity="0.85"/>

  <!-- ===== integrated, trackable barcode at the repaired site ===== -->
  <g>
    <rect x="104" y="198" width="8"  height="36" rx="2.5" fill="#3ddc84"/>
    <rect x="116" y="198" width="4"  height="36" rx="2"   fill="#dfeef2"/>
    <rect x="124" y="198" width="11" height="36" rx="2.5" fill="#2bc8ff"/>
    <rect x="139" y="198" width="4"  height="36" rx="2"   fill="#dfeef2"/>
    <rect x="147" y="198" width="8"  height="36" rx="2.5" fill="#ff7a18"/>
  </g>
</svg>
