<text x="40.0" y="542.0" font-size="9" fill="#94a3b8" font-weight="400" text-anchor="start">MCP–LexA(DBD)–FHA — a single fusion protein:  MCP binds MS2 loops  ·  LexA binds the LexO array  ·  FHA binds pT at the break</text>
<text x="40.0" y="556.0" font-size="9" fill="#64748b" font-weight="400" text-anchor="start" font-style="italic">pT = phospho-threonine (the FHA-binding mark at the Cas9 break)</text>
<text x="40.0" y="570.0" font-size="9" fill="#64748b" font-weight="400" text-anchor="start" font-style="italic">Plasmid assembly (proposed, mechanism not fully resolved): the one linear donor templates both the genomic edit and synthesis from the marker fragment into a new circular plasmid — without consuming the backbone.   ·   Roy et al., in preparation</text>
