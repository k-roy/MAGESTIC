# Conda environment for bc1_from_screen pipeline
# Author: Kevin R. Roy
#
# Usage:
#   conda env create -f environment.yaml
#   conda activate bc1_from_screen
#
# Or for Snakemake rules:
#   conda: "environment.yaml"

name: bc1_from_screen
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core Python
  - python>=3.10,<3.13

  # Data processing
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10

  # DESeq2 wrapper
  - pydeseq2>=0.4.0

  # Parallelization
  - joblib>=1.3

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  # Progress bars
  - tqdm>=4.65

  # YAML parsing
  - pyyaml>=6.0

  # Statistics
  - statsmodels>=0.14

  # File handling
  - openpyxl>=3.1  # Excel support
