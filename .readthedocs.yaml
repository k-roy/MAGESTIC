version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Install the package (no deps) so mkdocstrings can resolve cross-references
      # against the real API; griffe falls back to static analysis of src/ if an
      # optional dependency is unavailable on the RTD builder.
      - python -m pip install --no-deps .

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
