name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests (skip integration — requires Oak data paths)
        run: pytest tests/ -m "not integration" -v --tb=short

      - name: Verify CLI entry points load
        run: |
          magestic-design-vcf --help
          magestic-design-saturation --help
          magestic-gdb-pipeline --help
          magestic-bc1-link --help
          magestic-screen-analysis --help

      - name: Verify bundled NRD1 data is accessible
        run: |
          python -c "
          from magestic.projects.nrd1 import get_nrd1_data_path
          for f in ['DNA_codon_to_AA.txt', 'DNA_codon_to_AA_suboptimal_codons_removed.txt', 'NRD1_alanine_scan_with_PTC_and_syn_controls.tsv']:
              p = get_nrd1_data_path(f)
              assert p.exists(), f'Missing bundled data file: {f}'
          print('All bundled NRD1 data files accessible')
          "
